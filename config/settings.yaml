# new_trader_claude の設定ファイル
# 金額はすべて円。変更したら GitHub 上で commit すれば次回の実行から反映されます。

# paper = 模擬運用（通知に【模擬】と付く）、live = 実運用
mode: paper

# 証券会社（通知文の注文方法の案内にだけ使う）: sbi / rakuten
broker: sbi

# ---------------------------------------------------------------
# 積立（コア）: 資金の8割。証券会社の積立設定で自動購入する前提。
# システムは「推定評価額」と配分比率を月次レポートに出すだけ。
# ---------------------------------------------------------------
core:
  initial_amount: 200000      # 最初に積立側へ入れる額
  monthly_amount: 40000       # 毎月の積立額
  fund_name: "eMAXIS Slim 全世界株式（オール・カントリー）"
  # 推定評価額の計算に使う、値動きが近い上場ETF（MAXIS全世界株式 オール・カントリー）
  proxy_ticker: "2559.T"

# ---------------------------------------------------------------
# 銘柄売買（サテライト）: 資金の2割。日本株を月1回入れ替える。
# ---------------------------------------------------------------
satellite:
  initial_capital: 50000      # 最初に銘柄売買へ入れる額
  monthly_contribution: 10000 # 毎月末までに追加入金する額
  lot_size: 1                 # 1 = 単元未満株（S株 / かぶミニ）、100 = 通常の100株単位
  cost_rate: 0.001            # 片道の取引コスト想定（スプレッド・約定のずれ）。0.1%
  tax_rate: 0.0               # NISA成長投資枠なら 0。特定口座なら 0.20315

strategy:
  max_positions: 4            # 同時に持つ銘柄数
  keep_rank: 10               # 保有銘柄は順位がこの値以内なら持ち続ける（売買回数を減らすため）
  max_per_sector: 2           # 同じ業種（東証33業種）から持つ最大数
  momentum_lookback: 252      # 上昇率を測る期間（営業日、約12か月）
  momentum_skip: 21           # 直近を除く期間（営業日、約1か月。短期の反動を避ける）
  trend_window: 200           # 長期トレンド判定の移動平均（営業日）
  trailing_stop: 0.15         # 保有中の最高値（終値）から15%下がったら売る
  min_turnover: 100000000     # 1日の売買代金の中央値（20日）の下限。1億円
  benchmark_ticker: "1306.T"  # 相場全体の判断に使う TOPIX 連動ETF
  regime_filter: true         # TOPIX が200日平均より下なら新規買いをせず全て売る
  max_drawdown: 0.20          # 銘柄売買資金が最高値から20%減ったら全て売る
  drawdown_pause_months: 3    # その後、新規買いを休む月数

universe:
  # 東証の規模区分。Core30 + Large70 = TOPIX100（大型で値動きが比較的穏やかな銘柄）
  tiers: ["TOPIX Core30", "TOPIX Large70"]
  max_age_days: 40            # この日数より古ければ JPX の一覧を取り直す

review:
  # 運用開始からこの月数が経ち、銘柄売買の成績が TOPIX を下回る幅がこれ以上なら見直しを促す
  min_months: 12
  underperform_threshold: 0.10

notify:
  weekly_summary: true        # 毎週最後の営業日に保有状況をまとめて送る
