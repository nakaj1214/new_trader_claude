name: ダッシュボード更新

# 毎日の売買判断・バックテストの後と、設定を変えたときに Web ページを作り直す。
# 初回だけ Settings → Pages → Source を「GitHub Actions」にする必要がある。
on:
  workflow_run:
    workflows: ["毎日の売買判断", "バックテスト（過去データでの検証）"]
    types: [completed]
  push:
    paths:
      - "config/**"
      - "src/trader/dashboard.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: ページを作る
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/build_dashboard.py --out site --repo "$REPO" --branch "$BRANCH"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
