[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "new-trader-claude"
version = "0.1.0"
description = "日本株の中期モメンタム売買シグナルを Discord に通知する、手動発注前提のシステム"
requires-python = ">=3.11"
dependencies = [
    "yfinance==1.7.0",
    "pandas==3.1.0",
    "numpy==2.5.4",
    "exchange-calendars==4.13.2",
    "requests==2.34.2",
    "PyYAML==6.0.3",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
